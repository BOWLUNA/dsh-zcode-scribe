# Every push and pull request runs the suite against a real harness install.
#
# Why CI installs a harness at all: the plugin imports `@deepseek-ai/dsh-tools`
# and `@deepseek-ai/schemastery`, which are host peers rather than runtime
# dependencies, and the tool-authoring DSL differs between the two dsh lines this
# package supports (property-level `required` is rejected by one and accepted by
# the other). Testing a single version would report green about a configuration
# half the users do not run.
#
# The matrix pins exactly the versions `engines.dsh` declares;
# tools/verify-version-consistency.mjs fails the build when the two drift apart.
#
# 0.1.5-rc.3 was added on 2026-09-24 because it is npm's `latest`: the version a
# user gets when they do not pin one. The declared range covered it, but no leg
# had ever run on it — which made "supported" a claim rather than a result. It is
# listed in the matrix list below rather than in `include`, because
# tools/verify-version-consistency.mjs decides "which versions CI tests" by
# reading that list; a leg added through `include` alone would fail its own
# `--dsh <version>` assertion.
name: test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22']
        dsh: ['0.1.5-rc.2', '0.1.6-alpha.2', '0.1.5-rc.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # `dsh plugin add` forwards to pnpm, which dsh does not bundle: without it
      # dsh exits 127 and the boot check below would fail for the wrong reason.
      # Pinned to the version this repository's boot records were taken with.
      - name: Install pnpm (dsh forwards `plugin add` to it)
        run: npm install -g pnpm@12.4.2
      - name: Install the harness for its peer packages
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/dsh@${{ matrix.dsh }}
      - name: Guard 1 - tests
        run: node test/run.mjs
      - name: Guard 2 - bilingual pairing (check only; CI never writes)
        run: node tools/verify-translation-pairing.mjs
      - name: Guard 3 - documented numbers vs the live run
        run: node tools/verify-doc-numbers.mjs
      - name: Guard 4 - shell syntax
        shell: bash
        run: bash -n install.sh && bash -n uninstall.sh && bash -n tools/resolve-dsh.sh
      - name: Guard 5 - version consistency against the matrix entry
        run: node tools/verify-version-consistency.mjs --dsh ${{ matrix.dsh }}
      # The only guard that applies the plugin to a real harness. Every other step
      # here reads pure logic or composed configuration, and on 2026-09-21 that gap
      # shipped a 1.0.0 which passed all of them and then failed to boot:
      # `cordis.patch.yml` still named the pre-rename package, and the loader
      # resolves that name while applying the tree. `--dump-config` was `exit 0`
      # with an empty stderr at the same moment. See tools/boot-check.mjs.
      #
      # It probes a TCP connection rather than a log line, and it does NOT assume
      # `dsh` is on PATH — this leg installs the harness locally and the check
      # finds it there. If a node-20 leg is ever added to the matrix, this step
      # must be skipped on it with an explicit `::warning::`: node 20 cannot
      # install the harness, and a silently skipped guard is no guard at all.
      - name: Guard 6 - boot check (the plugin installs and actually serves)
        run: node tools/boot-check.mjs --port 31859
